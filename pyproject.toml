[project]
name = "gd-dataset-scraper"
version = "1.0.0"
description = "Production-grade async Geometry Dash raw level dataset scraper"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9,<4",
    "aiofiles>=24.1,<25",
    "orjson>=3.10,<4",
]

[project.scripts]
gd-scrape = "gd_scraper.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

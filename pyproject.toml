[project]
name = "gd-dataset-scraper"
version = "1.0.0"
description = "Production-grade async Geometry Dash raw level dataset scraper"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9,<4",
    "aiofiles>=24.1,<25",
    "orjson>=3.10,<4",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    "python-multipart>=0.0.9,<1",
]

[project.scripts]
gd-scrape = "gd_scraper.__main__:main"
gd-tokenize = "gd_scraper.tokenizer:main"
gd-train-mechanics = "gd_scraper.train_mechanics:main"
gd-analyze-mechanics = "gd_scraper.analytics:main"
gd-validate-reconstruction = "gd_scraper.reconstruction:main"
gd-orchestrate-mechanics = "gd_scraper.orchestrator:main"
gd-screensavers = "screensavers.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

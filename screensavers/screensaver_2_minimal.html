<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GD AI Orchestrator - Minimal Screen</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #101418;
    color: #f1f7f4;
    font-family: Inter, Arial, sans-serif;
  }
  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .wrap {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 24px;
  }
  .panel {
    width: min(760px, 94vw);
    border: 1px solid rgba(111,255,199,0.22);
    background: rgba(12, 16, 19, 0.86);
    padding: clamp(26px, 5vw, 54px);
  }
  .eyebrow {
    color: #6fffc7;
    font: 700 12px Consolas, monospace;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    margin-bottom: 22px;
  }
  h1 {
    margin: 0;
    font-size: clamp(42px, 9vw, 92px);
    line-height: 0.95;
    letter-spacing: 0;
  }
  h1 span { color: #ffbe70; }
  .message {
    margin: 22px 0 0;
    max-width: 620px;
    color: #aac7bd;
    font-size: clamp(15px, 2.2vw, 19px);
    line-height: 1.55;
  }
  .stats {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    margin-top: 34px;
    border-top: 1px solid rgba(111,255,199,0.16);
  }
  .stat {
    padding: 18px 12px 0 0;
    min-width: 0;
  }
  .stat strong {
    display: block;
    font-size: clamp(20px, 3.4vw, 34px);
    line-height: 1.05;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .stat span {
    display: block;
    margin-top: 7px;
    color: #7a948b;
    font: 700 11px Consolas, monospace;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .footer {
    display: flex;
    justify-content: space-between;
    gap: 18px;
    margin-top: 32px;
    color: #7a948b;
    font: 700 12px Consolas, monospace;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  @media (max-width: 720px) {
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .footer { flex-direction: column; }
  }
</style>
</head>
<body>
<canvas id="net"></canvas>
<div class="wrap">
  <section class="panel">
    <div class="eyebrow" id="eyebrow">Waiting for orchestrator</div>
    <h1 id="headline">Pipeline<br><span>Idle.</span></h1>
    <p class="message" id="message">Start the orchestrator to stream scraper, tokenizer, trainer, evaluator, and monitor telemetry.</p>
    <div class="stats">
      <div class="stat"><strong id="dataset">0</strong><span>Dataset</span></div>
      <div class="stat"><strong id="rawq">0</strong><span>Raw queue</span></div>
      <div class="stat"><strong id="tokenq">0</strong><span>Token queue</span></div>
      <div class="stat"><strong id="loss">-</strong><span>Loss</span></div>
    </div>
    <div class="footer">
      <div id="event">WAITING</div>
      <div id="uptime">0:00:00</div>
    </div>
  </section>
</div>
<script src="orchestrator_common.js"></script>
<script>
const S = window.GDSaver;
const canvas = document.getElementById("net");
const ctx = canvas.getContext("2d");
let telemetry = S.fallback();

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

const points = Array.from({ length: 80 }, () => ({
  x: Math.random() * window.innerWidth,
  y: Math.random() * window.innerHeight,
  vx: (Math.random() - 0.5) * 0.45,
  vy: (Math.random() - 0.5) * 0.45,
}));

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  points.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
    if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
  });
  for (let i = 0; i < points.length; i += 1) {
    for (let j = i + 1; j < points.length; j += 1) {
      const dx = points[i].x - points[j].x;
      const dy = points[i].y - points[j].y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 150) {
        ctx.strokeStyle = `rgba(111,255,199,${(1 - dist / 150) * 0.18})`;
        ctx.beginPath();
        ctx.moveTo(points[i].x, points[i].y);
        ctx.lineTo(points[j].x, points[j].y);
        ctx.stroke();
      }
    }
  }
  points.forEach(p => {
    ctx.fillStyle = telemetry.active ? "rgba(111,255,199,0.75)" : "rgba(255,190,112,0.45)";
    ctx.fillRect(p.x, p.y, 2, 2);
  });
  requestAnimationFrame(draw);
}

function render(payload) {
  telemetry = payload;
  document.getElementById("eyebrow").textContent = payload.active
    ? `Orchestrator ${payload.mode}`
    : "Orchestrator idle";
  document.getElementById("headline").innerHTML = payload.active
    ? "Do Not<br><span>Shut Down.</span>"
    : "Pipeline<br><span>Idle.</span>";
  document.getElementById("message").textContent = payload.shutdownMessage;
  document.getElementById("dataset").textContent = S.formatInt(payload.dashboard.datasetSize);
  document.getElementById("rawq").textContent = S.formatInt(payload.dashboard.rawQueue);
  document.getElementById("tokenq").textContent = S.formatInt(payload.dashboard.tokenQueue);
  document.getElementById("loss").textContent = S.formatFloat(payload.trainer.trainLoss, 4);
  document.getElementById("event").textContent = payload.latestEvent;
  document.getElementById("uptime").textContent = S.formatDuration(payload.uptimeSeconds);
}

S.pollTelemetry(render);
setInterval(() => render(telemetry), 1000);
draw();
render(telemetry);
</script>
</body>
</html>
